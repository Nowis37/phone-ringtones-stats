# Phone Ringtones stats on the NAS. Its own project, its own volume, its own
# tunnel: nothing shared with Sauté.
#
#   mkdir -p ~/ringtones-stats && cd ~/ringtones-stats
#   (copy this file here as compose.yaml, and a .env with the values below)
#   mkdir -p .docker && sudo DOCKER_CONFIG=$PWD/.docker docker compose up -d --build
#
# DOCKER_CONFIG is not optional on ZimaOS: under sudo, Docker writes to
# /root/.docker, and /root is read-only there ("mkdir /root/.docker: read-only
# file system"). The same command redeploys after a push to the public copy.
#
# The image is built here, from the public repository: no registry, no login.
services:
  stats:
    build: https://github.com/Nowis37/phone-ringtones-stats.git#main
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env: the console password}
      # Read by the shared console on api.getsaute.com (GET /v1/console.json).
      # Empty: that route answers 401 to everybody. Generate: openssl rand -hex 32
      CONSOLE_TOKEN: ${CONSOLE_TOKEN:-}
    volumes:
      - stats-data:/data
  # Releases the sounds of the day (drip/drip.py): every hour, catalogue.json
  # rebuilt from catalogue-full.json on R2. The key is the one of Simon's Mac
  # (~/.config/phoneringtones/r2.env), scoped by Cloudflare to the sounds bucket.
  sounds:
    build: https://github.com/Nowis37/phone-ringtones-stats.git#main:drip
    restart: unless-stopped
    environment:
      R2_ENDPOINT: ${R2_ENDPOINT:?copy the three R2_ lines of r2.env into .env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?copy the three R2_ lines of r2.env into .env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?copy the three R2_ lines of r2.env into .env}
  # No port is published: the only way in is the tunnel, which does TLS.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?create the tunnel in Cloudflare, then paste its token}
    depends_on:
      - stats

volumes:
  stats-data:
